# Generates DEX.xcodeproj. Run `make project` (or `xcodegen`) after
# adding or removing app source files. The .xcodeproj itself is not committed.
name: DEX
options:
  bundleIdPrefix: com.dex
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  DexCore:
    path: Packages/DexCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
targets:
  DEX:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: DexCore
        product: MediaModel
      - package: DexCore
        product: ImageEngine
      - package: DexCore
        product: JobSystem
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: DEX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "DEX"
        # Lets Finder's "Open With" and Dock-icon drops hand images to the
        # app without making it the default viewer.
        # Finder right-click → Services → DEX ▸ … (handled by FinderServices).
        # An NSRequiredContext makes each service enabled by default.
        NSServices:
          - NSMenuItem: {default: "DEX/Convert to JPEG"}
            NSMessage: convertImages
            NSUserData: jpeg
            NSPortName: DEX
            NSSendFileTypes: [public.image]
            NSRequiredContext: {}
          - NSMenuItem: {default: "DEX/Convert to PNG"}
            NSMessage: convertImages
            NSUserData: png
            NSPortName: DEX
            NSSendFileTypes: [public.image]
            NSRequiredContext: {}
          - NSMenuItem: {default: "DEX/Convert to HEIC"}
            NSMessage: convertImages
            NSUserData: heic
            NSPortName: DEX
            NSSendFileTypes: [public.image]
            NSRequiredContext: {}
          - NSMenuItem: {default: "DEX/Convert to WebP"}
            NSMessage: convertImages
            NSUserData: webp
            NSPortName: DEX
            NSSendFileTypes: [public.image]
            NSRequiredContext: {}
          - NSMenuItem: {default: "DEX/Combine into PDF"}
            NSMessage: convertImages
            NSUserData: pdf
            NSPortName: DEX
            NSSendFileTypes: [public.image]
            NSRequiredContext: {}
          - NSMenuItem: {default: "DEX/Open in DEX"}
            NSMessage: openImages
            NSPortName: DEX
            NSSendFileTypes: [public.image, com.adobe.pdf]
            NSRequiredContext: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, com.adobe.pdf]
    entitlements:
      path: App/Support/DEX.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dex.app
        PRODUCT_NAME: DEX
        # Ad-hoc "Sign to Run Locally" until a Developer ID exists.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Shipped builds drop debug symbols (3.4 MB → 1.5 MB binary);
          # dSYMs keep crash logs readable.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
